name: Playwright Tests — Sauce Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Screenshot baselines are win32-specific — font rendering on the Linux
      # runner would diff on every pixel. Regenerate them locally with
      # `npm run test:update-snapshots`.
      - run: npx playwright test --grep-invert @visual
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: snapshots-diff
          path: test-results/
          retention-days: 7
      - name: List every defined test (incl. ones CI filters out)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: inventory.json
        run: npx playwright test --list --reporter=json
      - name: Keep totals for the stats job
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: test-stats
          path: |
            results.json
            inventory.json
          if-no-files-found: ignore
          retention-days: 1

  # The only job that can mint the stats token. It never runs `npm ci` or any
  # repo code besides the dependency-free publish script, so a compromised
  # package elsewhere in the pipeline cannot request the OIDC token.
  publish-stats:
    name: Publish test stats
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write   # OIDC token for Workload Identity Federation
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/publish-test-stats.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: actions/download-artifact@v8
        with: { name: test-stats, path: stats }
      - name: Authenticate to portfolio Firestore
        # Keyless: GitHub OIDC -> Workload Identity Federation. Only pushes to
        # main in NNEWNERR repos can mint this token.
        id: gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/932862873750/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: ci-stats-writer@supakorn-portfolio.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - name: Publish test stats to nnewnerr.github.io
        # Runs on red builds too — the portfolio shows the latest result, not
        # the latest green one. Never fails the build on its own.
        env:
          FIRESTORE_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          inventory=()
          [ -f stats/inventory.json ] && inventory=(--inventory stats/inventory.json)
          node scripts/publish-test-stats.mjs --suite sauce-demo-tests --repo sauce-demo-tests --label "Playwright" --kind playwright --file stats/results.json "${inventory[@]}"
