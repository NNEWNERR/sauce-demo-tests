name: Playwright Tests — Sauce Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Screenshot baselines are win32-specific — font rendering on the Linux
      # runner would diff on every pixel. Regenerate them locally with
      # `npm run test:update-snapshots`.
      - run: npx playwright test --grep-invert @visual
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: snapshots-diff
          path: test-results/
          retention-days: 7